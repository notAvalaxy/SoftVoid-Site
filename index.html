<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>softvoid.cc - EXP Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CDNs for Tesseract.js (OCR) and Chart.js (Analytics) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #1a1a2e, #0e0e1a);
      color: #e0e0ff;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .star {
      position: absolute;
      width: 1px;
      height: 1px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* EXP Tracker Main Glassmorphism Panel */
    .tracker-panel {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 800px;
      margin: 60px auto;
      padding: 28px;
      background: rgba(20, 20, 35, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(224, 224, 255, 0.12);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    h2 {
      margin-top: 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    p {
      opacity: 0.85;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }
    .btn:hover { background: #2563eb; transform: translateY(-1px); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: bold;
      color: #93c5fd;
      margin-top: 6px;
    }

    .instruction-hint {
      font-size: 0.85rem;
      color: #93c5fd;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: crosshair;
    }

    video, canvas {
      width: 100%;
      display: block;
    }

    .chart-wrapper {
      margin-top: 25px;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 10px;
    }

    #audio-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 10px;
      height: 10px;
      background-color: #aaccff;
      border-radius: 50%;
      opacity: 0.5;
      animation: pulse 2s infinite ease-in-out;
      z-index: 999;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.4); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Audio Indicator Dot -->
  <div id="audio-indicator"></div>

  <!-- EXP Tracker Interface Panel -->
  <div class="tracker-panel">
    <h2>Game EXP Tracker</h2>
    <p>
      Share your game window. Once active, you can <b>click and drag directly on the video preview below</b> to frame your EXP bar precisely. Your box position is automatically remembered!
